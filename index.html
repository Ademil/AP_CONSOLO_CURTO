    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premiumGold: '#D4AF37',
                    },
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],

                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },

                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },

            <!-- Action Grid -->
            <div class="grid grid-cols-2 gap-4">

        <p class="mt-8 text-white/40 text-[9px] font-light tracking-widest uppercase text-center">

    <!-- Modals Section -->
    
    <!-- Add Property Modal -->
    <div id="modal-add" class="fixed inset-0 z-[150] hidden items-center justify-center p-4 animate-fade-in">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="toggleAddForm(false)"></div>
        <div class="relative w-full max-w-lg glass rounded-[2.5rem] p-8 shadow-2xl border border-white/20 overflow-y-auto max-h-[90vh] no-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-premiumGold flex items-center gap-2 uppercase tracking-tighter">
                    <i class="fa-solid fa-house-medical"></i> Novo Imóvel
                </h2>
                <button onclick="toggleAddForm(false)" class="text-white/40 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="property-form" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-3 gap-2" id="type-selector">
                    <button type="button" onclick="selectType('Casa')" data-type="Casa" class="type-btn py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border border-premiumGold bg-premiumGold text-black transition-all">Casa</button>
                    <button type="button" onclick="selectType('Apartamento')" data-type="Apartamento" class="type-btn py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border border-white/10 bg-white/5 text-white/40 transition-all">Apto</button>
                    <button type="button" onclick="selectType('Terreno')" data-type="Terreno" class="type-btn py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border border-white/10 bg-white/5 text-white/40 transition-all">Lote</button>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] text-white/40 uppercase font-black ml-1 tracking-widest">Título do Imóvel</label>
                    <input id="f-name" required class="w-full bg-white/5 border border-white/10 rounded-xl px-5 py-4 text-white text-sm" placeholder="Ex: Mansão Vista Mar">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] text-white/40 uppercase font-black ml-1 tracking-widest">Privativa</label>

                    <div class="space-y-1">
                        <label class="text-[9px] text-white/40 uppercase font-black ml-1 tracking-widest">Total</label>

                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div class="space-y-1 text-center">
                        <label class="text-[9px] text-white/40 uppercase font-black tracking-widest block">Dorms</label>

                    <div class="space-y-1 text-center">
                        <label class="text-[9px] text-white/40 uppercase font-black tracking-widest block">Banheiros</label>
                        <input id="f-bath" class="w-full bg-white/5 border border-white/10 rounded-xl px-2 py-3 text-white text-sm text-center" placeholder="0">
                    </div>
                    <div class="space-y-1 text-center">
                        <label class="text-[9px] text-white/40 uppercase font-black tracking-widest block">Vagas</label>

                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[9px] text-white/40 uppercase font-black ml-1 tracking-widest">Fotos (Anexe pelo menos 1)</label>
                    <div class="relative w-full min-h-[80px] border-2 border-dashed border-white/10 rounded-2xl flex flex-col items-center justify-center transition-all hover:bg-white/5">
                        <input type="file" id="f-photos" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                        <div id="photo-preview" class="p-2 w-full grid grid-cols-4 gap-2 text-[10px] text-white/30 text-center uppercase font-bold">Selecionar Fotos</div>

                <div class="space-y-1">
                    <label class="text-[9px] text-white/40 uppercase font-black ml-1 tracking-widest">Vídeo Tour (Opcional)</label>
                    <input type="file" id="f-video" accept="video/*" class="w-full text-[10px] file:bg-white/10 file:border-none file:text-white file:rounded-lg file:px-4 file:py-2 text-white/40">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] bg-premiumGold text-black shadow-2xl transition-all active:scale-95">

    <!-- Details Modal -->
    <div id="modal-details" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 animate-fade-in">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-2xl" onclick="closeDetails()"></div>
        <div id="details-content" class="relative w-full max-w-lg glass rounded-[2.5rem] p-6 max-h-[90vh] overflow-y-auto shadow-2xl border border-white/20 animate-slide-up no-scrollbar">
            <!-- Injected via JS -->
        </div>

    <!-- Fullscreen Image View -->
    <div id="fullscreen-view" class="fixed inset-0 z-[200] hidden flex-col items-center justify-center bg-black/98 p-4 backdrop-blur-xl animate-fade-in" onclick="this.classList.add('hidden')">
        <img id="fullscreen-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl border border-white/10">
        <p class="mt-8 text-white/50 text-[10px] font-black uppercase tracking-[0.5em]">Toque para fechar</p>
    </div>

    <script>
        // --- ESTADO DA APLICAÇÃO ---
        let properties = [];
        let selectedProperty = null;
        let currentType = 'Casa';
        let tempImages = [];
        let tempVideo = null;
        let deleteConfirmations = {};

        // --- INICIALIZAÇÃO ---
        window.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.getElementById('main-content');
            mainContent.classList.remove('opacity-0', 'translate-y-10');
            
            const saved = localStorage.getItem('pavan_properties_v2');
            if (saved) {
                properties = JSON.parse(saved);
            } else {
                properties = [{
                    id: 'default-1',
                    type: 'Casa',
                    name: 'Mansão Horizon - Jardins',
                    mainImage: 'https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&q=80&w=600',
                    gallery: [
                        "https://images.unsplash.com/photo-1600607687940-c52af036999b?auto=format&fit=crop&q=80&w=800",
                        "https://images.unsplash.com/photo-1600566753190-17f0bb2a6c3e?auto=format&fit=crop&q=80&w=800"
                    ],
                    video: "https://assets.mixkit.co/videos/preview/mixkit-modern-luxury-home-interior-4404-large.mp4",
                    areaPrivativa: '850m²',
                    areaTotal: '1.200m²',
                    bedrooms: '05',
                    bathrooms: '06',
                    parking: '08'
                }];
            }
            renderProperties();
        });

        // --- RENDERIZAÇÃO ---
        function renderProperties() {
            const list = document.getElementById('properties-list');
            list.innerHTML = '';

            if (properties.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10 border-2 border-dashed border-white/10 rounded-3xl">
                        <p class="text-white/40 text-[10px] uppercase font-bold tracking-widest">Nenhum imóvel cadastrado.</p>
                    </div>
                `;
                return;
            }

            properties.forEach(prop => {
                const card = document.createElement('div');
                card.className = "relative p-5 rounded-[2rem] bg-white/5 border border-white/10 overflow-hidden shadow-inner group";
                
                const isConfirming = deleteConfirmations[prop.id];

                card.innerHTML = `
                    <button 
                        onclick="handleDeleteClick(event, '${prop.id}')"
                        class="absolute top-4 right-4 z-[100] h-12 rounded-full flex items-center justify-center shadow-2xl transition-all duration-300 border-2 border-white/30 cursor-pointer ${isConfirming ? 'bg-red-600 px-4 w-auto animate-pulse' : 'bg-black/50 w-12'}"
                    >
                        ${isConfirming ? '<span class="text-[9px] font-black text-white uppercase tracking-widest"><i class="fa-solid fa-check"></i> CONFIRMAR?</span>' : '<i class="fa-solid fa-trash-can text-white text-lg"></i>'}
                    </button>

                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[9px] font-black text-white/60 uppercase tracking-widest">${prop.type}</span>
                    </div>

                    <div class="relative rounded-2xl overflow-hidden shadow-lg border border-white/5 cursor-pointer transition-opacity ${isConfirming ? 'opacity-40 grayscale' : 'opacity-100'}" onclick="openDetails('${prop.id}')">
                        <img src="${prop.mainImage}" class="w-full h-52 object-cover transition-transform duration-1000 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/20 to-transparent flex flex-col justify-end p-5">
                            <p class="text-white text-base font-bold mb-3 tracking-wide">${prop.name}</p>
                            <button class="w-full text-[10px] font-bold text-white bg-white/10 backdrop-blur-md py-3.5 rounded-xl border border-white/20 uppercase tracking-wider">VER DETALHES</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // --- LÓGICA DE EXCLUSÃO ---
        function handleDeleteClick(e, id) {
            e.stopPropagation();
            if (deleteConfirmations[id]) {
                properties = properties.filter(p => p.id !== id);
                delete deleteConfirmations[id];
                localStorage.setItem('pavan_properties_v2', JSON.stringify(properties));
                renderProperties();
            } else {
                deleteConfirmations[id] = true;
                renderProperties();
                setTimeout(() => {
                    if (deleteConfirmations[id]) {
                        delete deleteConfirmations[id];
                        renderProperties();
                    }
                }, 3000);
            }
        }

        // --- FORMULÁRIO ---
        function toggleAddForm(show) {
            const modal = document.getElementById('modal-add');
            modal.style.display = show ? 'flex' : 'none';
            if (!show) {
                document.getElementById('property-form').reset();
                tempImages = [];
                tempVideo = null;
                document.getElementById('photo-preview').innerHTML = 'Selecionar Fotos';
            }
        }

        function selectType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                if (btn.dataset.type === type) {
                    btn.className = "type-btn py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border border-premiumGold bg-premiumGold text-black transition-all";
                } else {
                    btn.className = "type-btn py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border border-white/10 bg-white/5 text-white/40 transition-all";
                }
            });
        }

        // Handle Photo Inputs
        document.getElementById('f-photos').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            tempImages = [];
            const preview = document.getElementById('photo-preview');
            preview.innerHTML = '';
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    tempImages.push(ev.target.result);
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.className = "aspect-square object-cover rounded-lg border border-white/20";
                    preview.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('f-video').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => { tempVideo = ev.target.result; }
                reader.readAsDataURL(file);
            }
        });

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('f-name').value;
            if (tempImages.length === 0) return alert('Anexe pelo menos 1 foto.');

            const newProp = {
                id: Date.now().toString(),
                type: currentType,
                name: name,
                mainImage: tempImages[0],
                gallery: tempImages.slice(1),
                video: tempVideo,
                areaPrivativa: document.getElementById('f-areaP').value || '-',
                areaTotal: document.getElementById('f-areaT').value || '-',
                bedrooms: document.getElementById('f-bed').value || '0',
                bathrooms: document.getElementById('f-bath').value || '0',
                parking: document.getElementById('f-park').value || '0'
            };

            properties.unshift(newProp);
            localStorage.setItem('pavan_properties_v2', JSON.stringify(properties));
            toggleAddForm(false);
            renderProperties();
        }

        // --- DETALHES ---
        function openDetails(id) {
            selectedProperty = properties.find(p => p.id === id);
            const content = document.getElementById('details-content');
            renderDetailsContent('details');
            document.getElementById('modal-details').style.display = 'flex';
        }

        function closeDetails() {
            document.getElementById('modal-details').style.display = 'none';
        }

        function renderDetailsContent(view) {
            const p = selectedProperty;
            const container = document.getElementById('details-content');
            
            let innerHTML = `
                <button onclick="closeDetails()" class="absolute top-6 right-6 w-12 h-12 flex items-center justify-center rounded-full bg-white/10 text-white z-10"><i class="fa-solid fa-xmark text-xl"></i></button>
                <div class="mb-6 mt-4">
                    <h2 class="text-premiumGold font-bold text-xl mb-1 uppercase tracking-wider">${p.name}</h2>
                    <div class="flex items-center gap-2 text-white/40 text-[10px] uppercase tracking-widest font-medium"><i class="fa-solid fa-location-dot text-premiumGold"></i> Propriedade Selecionada</div>
                </div>
                <div class="flex p-1.5 bg-white/5 rounded-2xl mb-6 border border-white/5">
                    <button onclick="renderDetailsContent('details')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${view === 'details' ? 'bg-premiumGold text-black' : 'text-white/40'}">Geral</button>
                    <button onclick="renderDetailsContent('photos')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${view === 'photos' ? 'bg-premiumGold text-black' : 'text-white/40'}">Fotos & Vídeo</button>
                </div>
            `;

            if (view === 'details') {
                innerHTML += `
                    <div class="animate-fade-in">
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-white/5 p-4 rounded-[1.5rem] border border-white/10 text-center">
                                <span class="text-[9px] text-white/40 block mb-1 uppercase font-bold">Privativa</span>
                                <span class="text-sm font-bold text-white">${p.areaPrivativa}</span>
                            </div>
                            <div class="bg-white/5 p-4 rounded-[1.5rem] border border-white/10 text-center">
                                <span class="text-[9px] text-white/40 block mb-1 uppercase font-bold">Total</span>
                                <span class="text-sm font-bold text-white">${p.areaTotal}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-3 mb-6">
                            <div class="bg-white/5 p-4 rounded-[1.5rem] border border-white/10 text-center">
                                <i class="fa-solid fa-bed text-premiumGold mb-2 block"></i>
                                <span class="text-[9px] text-white/40 block mb-1 uppercase font-bold">Dorms</span>
                                <span class="text-xs font-bold text-white">${p.bedrooms}</span>
                            </div>
                            <div class="bg-white/5 p-4 rounded-[1.5rem] border border-white/10 text-center">
                                <i class="fa-solid fa-sink text-premiumGold mb-2 block"></i>
                                <span class="text-[9px] text-white/40 block mb-1 uppercase font-bold">Banh.</span>
                                <span class="text-xs font-bold text-white">${p.bathrooms}</span>
                            </div>
                            <div class="bg-white/5 p-4 rounded-[1.5rem] border border-white/10 text-center">
                                <i class="fa-solid fa-car text-premiumGold mb-2 block"></i>
                                <span class="text-[9px] text-white/40 block mb-1 uppercase font-bold">Vagas</span>
                                <span class="text-xs font-bold text-white">${p.parking}</span>
                            </div>
                        </div>
                        <img src="${p.mainImage}" class="w-full rounded-2xl border border-white/10">

                `;
            } else {
                innerHTML += `
                    <div class="animate-fade-in space-y-8">
                        ${p.video ? `
                            <div class="relative rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-black/40 aspect-video">
                                <video src="${p.video}" class="w-full h-full object-cover" controls loop muted playsInline></video>
                                <div class="absolute top-4 left-4 bg-premiumGold text-black text-[9px] font-black px-3 py-1 rounded-full shadow-lg z-10 pointer-events-none uppercase">Tour Vídeo</div>
                            </div>
                        ` : ''}
                        <div class="grid grid-cols-2 gap-4">
                            <div class="relative rounded-2xl overflow-hidden shadow-xl border border-white/10 aspect-square" onclick="showFullscreen('${p.mainImage}')">
                                <img src="${p.mainImage}" class="w-full h-full object-cover">
                            </div>
                            ${p.gallery.map(img => `
                                <div class="relative rounded-2xl overflow-hidden shadow-xl border border-white/10 aspect-square" onclick="showFullscreen('${img}')">
                                    <img src="${img}" class="w-full h-full object-cover">

                            `).join('')}
                        </div>
                    </div>
                `;
            }

            innerHTML += `
                <a href="https://api.whatsapp.com/send?phone=5548999862981&text=Gostaria de informações sobre: ${p.name}" target="_blank" class="w-full mt-8 py-5 bg-premiumGold text-black font-black rounded-2xl flex items-center justify-center gap-3 shadow-xl uppercase tracking-[0.2em] text-[10px]">
                    <i class="fa-brands fa-whatsapp text-xl"></i> SOLICITAR APRESENTAÇÃO
                </a>
            `;
            container.innerHTML = innerHTML;
        }

        function showFullscreen(url) {
            const f = document.getElementById('fullscreen-view');
            document.getElementById('fullscreen-img').src = url;
            f.classList.remove('hidden');
            f.classList.add('flex');
        }

        // --- VCARD ---
        function saveContact() {
            const vCardData = `BEGIN:VCARD\nVERSION:3.0\nFN:Ademilton Pavan\nORG:Pavan Luxury Estates\nTITLE:Corretor de Imóveis CRECI-SC 72451\nTEL;TYPE=CELL:+5548999862981\nEMAIL:apavaneng@gmail.com\nEND:VCARD`;
            const blob = new Blob([vCardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Ademilton_Pavan.vcf');
            link.click();
        }

        // --- RESET ---
        function resetApp() {
            if (confirm("Isso apagará todos os imóveis e restaurará o padrão. Continuar?")) {
                localStorage.removeItem('pavan_properties_v2');
                location.reload();
            }
        }
    </script>
